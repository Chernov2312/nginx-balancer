services:
  backend-1:
    build: ./backend
    environment:
      - INSTANCE_ID=Backend_1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  backend-2:
    build: ./backend
    environment:
      - INSTANCE_ID=Backend_2
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]

  backend-3:
    build: ./backend
    environment:
      - INSTANCE_ID=Backend_3
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx_weight.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-1:
        condition: service_started
      backend-2:
        condition: service_started
      backend-3:
        condition: service_started